server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container health check (see Dockerfile).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ThoughtSpot's Spotter MCP Server (the Brief page) sends no CORS headers, so
    # the browser reaches it through this origin. A plain pass-through: the
    # user's own bearer token rides in each request; nothing is stored here.
    location = /ts-mcp {
        proxy_pass https://agent.thoughtspot.app/token/mcp;
        proxy_ssl_server_name on;
        proxy_set_header Host agent.thoughtspot.app;
        proxy_http_version 1.1;
        # Replies can stream (server-sent events), and a dashboard build is polled for minutes.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Vite's hashed bundles never change in place: cache them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/home, /insights, …) all serve the SPA shell, which
    # is never cached so a redeploy takes effect on the next load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
