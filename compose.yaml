# Local Docker testing only — Coolify builds the Dockerfile directly and
# doesn't use this file. Run with: npm run docker:up (wraps
# `docker compose --env-file .env.local up --build -d`). Copy .env.example to
# .env.local first and fill in THOUGHTSPOT_SECRET_KEY.
services:
  storeloom:
    build:
      context: .
      args:
        # Bare names: Compose fills these from its interpolation environment
        # (--env-file .env.local) and passes them through as Docker build args.
        - VITE_TS_HOST
        - VITE_INSIGHTS_LIVEBOARD_ID
        - VITE_REGION_LIVEBOARD_ID
    # Loads every var in .env.local into the running container: this supplies
    # the server's runtime secrets (THOUGHTSPOT_SECRET_KEY, THOUGHTSPOT_ORG_ID…).
    # The VITE_* ones are harmless at runtime (already baked into the bundle).
    env_file:
      - .env.local
    ports:
      # Host port 3100, not 5173: 5173 is kept free for `npm run dev`.
      - "3100:3000"
